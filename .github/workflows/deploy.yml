name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Build Project
      run: |
        cd webhook-lab
        npm install
        npm run build
        
    - name: Prepare Deployment Package
      run: |
        mkdir deploy_package
        # Copy compiled frontend assets to root of deploy package
        cp -R webhook-lab/dist/* deploy_package/
        # Copy backend folder to deploy package
        cp -R webhook-lab/backend deploy_package/backend
        
    - name: Generate Production Config
      run: |
        cat << 'EOF' > deploy_package/backend/config/config.php
        <?php
        header("Access-Control-Allow-Origin: *");
        header("Access-Control-Allow-Methods: GET, POST, OPTIONS");
        header("Access-Control-Allow-Headers: Content-Type, Authorization");
        header("Content-Type: application/json; charset=UTF-8");
        
        if ($_SERVER['REQUEST_METHOD'] == 'OPTIONS') {
            exit(0);
        }
        
        define('DB_HOST', '${{ secrets.DB_HOST }}');
        define('DB_NAME', '${{ secrets.DB_NAME }}');
        define('DB_USER', '${{ secrets.DB_USER }}'); 
        define('DB_PASS', '${{ secrets.DB_PASS }}');     
        
        define('GAME_VERSION', '1.0.0');
        EOF

        
    - name: Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT }}
        server-dir: ./
        local-dir: deploy_package/
